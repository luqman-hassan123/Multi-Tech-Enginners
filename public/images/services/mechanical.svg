<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#061a4a"/>
  <rect y="370" width="800" height="130" fill="#0f172a"/>
  <!-- Generator / machinery -->
  <rect x="250" y="200" width="300" height="170" rx="8" fill="#334155"/>
  <rect x="270" y="220" width="120" height="80" fill="#1e293b"/>
  <circle cx="450" cy="270" r="45" fill="none" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="450" cy="270" r="15" fill="#0ea5e9"/>
  <!-- Pipes -->
  <rect x="180" y="260" width="70" height="20" fill="#64748b"/>
  <rect x="550" y="250" width="100" height="16" fill="#64748b"/>
  <!-- Crane arm -->
  <line x1="100" y1="370" x2="100" y2="150" stroke="#475569" stroke-width="8"/>
  <line x1="100" y1="150" x2="220" y2="200" stroke="#475569" stroke-width="6"/>
  <line x1="220" y1="200" x2="220" y2="280" stroke="#38bdf8" stroke-width="3"/>
  <!-- Workers silhouette -->
  <ellipse cx="620" cy="355" rx="12" ry="8" fill="#475569"/>
  <rect x="612" y="320" width="16" height="35" fill="#475569"/>
  <text x="400" y="460" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="16" opacity="0.6">Mechanical Works</text>
</svg>
