<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#03102f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="380" width="800" height="120" fill="#1e293b"/>
  <!-- Power poles -->
  <line x1="120" y1="120" x2="120" y2="380" stroke="#475569" stroke-width="6"/>
  <line x1="280" y1="80" x2="280" y2="380" stroke="#475569" stroke-width="6"/>
  <line x1="440" y1="100" x2="440" y2="380" stroke="#475569" stroke-width="6"/>
  <line x1="600" y1="90" x2="600" y2="380" stroke="#475569" stroke-width="6"/>
  <!-- Wires -->
  <path d="M120 140 Q200 160 280 120 T440 140 T600 130" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <path d="M120 180 Q200 200 280 160 T440 180 T600 170" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <!-- Construction site -->
  <rect x="500" y="280" width="220" height="100" fill="#334155" opacity="0.8"/>
  <rect x="530" y="250" width="80" height="30" fill="#475569"/>
  <polygon points="520,280 570,220 620,280" fill="#64748b"/>
  <!-- Lightning bolt -->
  <path d="M200 200 L180 260 L210 260 L190 320 L240 240 L210 240 Z" fill="#fbbf24" opacity="0.9"/>
  <text x="400" y="460" text-anchor="middle" fill="#38bdf8" font-family="Arial,sans-serif" font-size="16" opacity="0.6">Electrical Works</text>
</svg>
